name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# GitHub: run action plugins with Node 24+ (avoids Node 20 deprecation; see
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/ )
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        # `pnpm run check` uses 8GB heap; standard runners are ~7GB RAM — use a smaller
        # heap in CI to avoid the process being killed (exit 1) under memory pressure.
        run: pnpm run check:ci

      - name: Unit tests
        run: pnpm test

  # Netlify starts git-based builds in parallel with this workflow; production `main` uses
  # `netlify.toml` ignore to skip those and only run a full build from a build hook after CI passes.
  trigger-netlify:
    name: Trigger Netlify build hook
    needs: check-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: POST build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "::error::Repository secret NETLIFY_BUILD_HOOK_URL is not set. In Netlify: Site configuration → Build & deploy → Build hooks → add hook for branch main, then add the URL in GitHub → Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL"

