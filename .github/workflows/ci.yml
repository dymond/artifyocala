name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# GitHub: run action plugins with Node 24+ (avoids Node 20 deprecation; see
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/ )
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Astro check
        # `pnpm run check` uses 8GB heap; standard runners are ~7GB RAM — use a smaller
        # heap in CI to avoid the process being killed (exit 1) under memory pressure.
        run: pnpm run check:ci

      - name: Unit tests
        run: pnpm test

