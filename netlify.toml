[build]
  # Needs PUBLIC_TINA_CLIENT_ID + TINA_TOKEN in Netlify env (see .env.example).
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Tina admin SPA: serve index without requiring /admin/index.html in the URL.
# Only these exact paths — do not use /admin/* or /admin/assets/* would break.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/maker-collective"
  to = "/programs/maker-collective"
  status = 301

[[redirects]]
  from = "/maker-collective/equipment"
  to = "/programs/maker-collective/equipment"
  status = 301

[[redirects]]
  from = "/brick-city-glam"
  to = "/programs/brick-city-glam"
  status = 301

[[redirects]]
  from = "/storytelling-knights"
  to = "/programs/storytelling-knights"
  status = 301
