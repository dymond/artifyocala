[build]
  # Needs PUBLIC_TINA_CLIENT_ID + TINA_TOKEN in Netlify env (see .env.example for local vars).
  # build:deploy skips Tina Cloud schema SHA check — Netlify often runs before indexing catches up after a push.
  # Local strict check: `npm run build` (no --skip-cloud-checks).
  command = "npm run build:deploy"
  publish = "dist"

# Restore/save `node_modules/.astro` and `node_modules/.vite` across deploys (`npm ci` wipes node_modules).
[[plugins]]
  package = "./netlify/plugins/cache-astro-vite"

# Pa11y default checkPaths ["/"] walks every HTML file; the home page loads WebGL + heavy JS and often hits Pa11y’s 30s timeout on CI. Pin explicit routes (omit /index.html). Merges with the Netlify UI–installed plugin of the same name.
[[plugins]]
  package = "netlify-plugin-a11y"
  [plugins.inputs]
    checkPaths = [
      "/404.html",
      "/about/index.html",
      "/donate/index.html",
      "/volunteer/index.html",
      "/programs/maker-collective/index.html",
      "/programs/maker-collective/equipment/index.html",
      "/programs/brick-city-glam/index.html",
      "/programs/storytelling-knights/index.html",
    ]

[build.environment]
  NODE_VERSION = "22"
  # Minor npm install speed-up on Netlify
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  # Parallel static page builds (Astro default is 1). Override in Netlify UI if builds OOM.
  ASTRO_BUILD_CONCURRENCY = "4"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Tina admin SPA: serve index without requiring /admin/index.html in the URL.
# Only these exact paths — do not use /admin/* or /admin/assets/* would break.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/maker-collective"
  to = "/programs/maker-collective"
  status = 301

[[redirects]]
  from = "/maker-collective/equipment"
  to = "/programs/maker-collective/equipment"
  status = 301

[[redirects]]
  from = "/brick-city-glam"
  to = "/programs/brick-city-glam"
  status = 301

[[redirects]]
  from = "/storytelling-knights"
  to = "/programs/storytelling-knights"
  status = 301
