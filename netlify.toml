[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/maker-collective"
  to = "/programs/maker-collective"
  status = 301

[[redirects]]
  from = "/maker-collective/equipment"
  to = "/programs/maker-collective/equipment"
  status = 301

[[redirects]]
  from = "/brick-city-glam"
  to = "/programs/brick-city-glam"
  status = 301

[[redirects]]
  from = "/storytelling-knights"
  to = "/programs/storytelling-knights"
  status = 301
