[build]
  # Needs PUBLIC_TINA_CLIENT_ID + TINA_TOKEN in Netlify env (see .env.example for local vars).
  # build:deploy skips Tina Cloud schema SHA check — Netlify often runs before indexing catches up after a push.
  # Local strict check: `pnpm run build` (no --skip-cloud-checks).
  # CI skips `tinacms build` when only CMS content/media changed (see scripts/netlify-build.mjs).
  # `pnpm rebuild esbuild`: pnpm 10 may skip install scripts; without the native binary Vite’s esbuild
  # minify pass can throw opaque errors (e.g. Syntax error "d" in client chunks). See package.json `pnpm.onlyBuiltDependencies`.
  # Drop Vite’s dep cache so we never merge stale pre-bundles with a new config (see cache-astro-vite plugin).
  command = "rm -rf node_modules/.vite && pnpm rebuild esbuild && pnpm run build:netlify:ci"
  publish = "dist"

# Restore/save `node_modules/.astro` and `node_modules/.vite` across deploys (install step recreates node_modules).
[[plugins]]
  package = "./netlify/plugins/cache-astro-vite"

[[plugins]]
  package = "./netlify/plugins/cache-images-gen"

[[plugins]]
  package = "./netlify/plugins/cache-tina-admin"

[build.environment]
  NODE_VERSION = "22"
  NETLIFY = "true"
  # Minor npm install speed-up on Netlify
  NPM_CONFIG_AUDIT = "false"
  NPM_CONFIG_FUND = "false"
  # Parallel static page builds (Astro default is 1). Override in Netlify UI if builds OOM.
  ASTRO_BUILD_CONCURRENCY = "8"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    # Baseline security headers (static Astro site on Netlify)
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"
    # Non-breaking Trusted Types rollout (report-only). Keep /admin exempt below.
    Content-Security-Policy-Report-Only = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.googletagmanager.com https://www.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com; worker-src 'self' blob:; manifest-src 'self'; require-trusted-types-for 'script'; trusted-types default; report-sample"
    Cross-Origin-Opener-Policy = "same-origin"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy = "attribution-reporting=(), shared-storage=()"

[[headers]]
  for = "/admin/*"
  [headers.values]
    # Tina admin is a separate SPA; keep Trusted Types in report-only OFF here.
    Content-Security-Policy-Report-Only = ""

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Tina admin SPA: serve index without requiring /admin/index.html in the URL.
# Only these exact paths — do not use /admin/* or /admin/assets/* would break.
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/about-us"
  to = "/about"
  status = 301

[[redirects]]
  from = "/maker-collective"
  to = "/programs/maker-collective"
  status = 301

[[redirects]]
  from = "/maker-collective/equipment"
  to = "/programs/maker-collective/equipment"
  status = 301

[[redirects]]
  from = "/brick-city-glam"
  to = "/programs/brick-city-glam"
  status = 301

[[redirects]]
  from = "/storytelling-knights"
  to = "/programs/storytelling-knights"
  status = 301
